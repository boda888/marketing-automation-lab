[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "n8n-reliability"
version = "0.0.3"
description = "Reliability kit for n8n outbound workflows: per-item retries with backoff and Retry-After that never re-send succeeded items or blindly retry non-idempotent creates, with DLQ rows for everything that did not land"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "pydantic>=2.6"]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "pydantic>=2.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reply-routing"
version = "0.0.6"
description = "Webhook intake (auth, event keys, dedupe), deterministic reply classification, a schema-validated LLM intent stage with human-review fallback, and cross-channel stop / pause routing, a labelled eval set with a cost-aware scorer, and a FastAPI intake service"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "pydantic>=2.6"]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "pydantic>=2.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

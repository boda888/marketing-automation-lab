[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reply-routing"
version = "0.0.1"
description = "Deterministic reply classification (bounce, auto-reply / OOO, unsubscribe, wrong person, referral) and cross-channel stop / pause routing"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
